<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Pass</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4 font-sans">
    <div class="w-full max-w-md bg-slate-800 rounded-[2.5rem] p-8 shadow-2xl border border-slate-700">
        <h1 class="text-3xl font-extrabold text-center mb-8 bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent italic">
            AI GENERATOR
        </h1>
        
<div class="relative group">
                <div class="bg-slate-900/50 p-6 rounded-2xl border border-slate-700 flex justify-between items-center shadow-inner">
                    <span id="password-display" class="text-2xl font-mono text-cyan-300 break-all tracking-wider">********</span>
                    <button onclick="copyToClipboard()" class="ml-2 p-2 hover:bg-slate-700 rounded-xl transition-all text-slate-400 hover:text-cyan-400 active:scale-90" title="Copia">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                    </button>
                </div>
                <span id="copy-toast" class="absolute -top-6 right-2 bg-cyan-500 text-white text-[10px] font-bold px-3 py-1 rounded-full opacity-0 transition-all duration-300 z-50 shadow-xl">COPIATO!</span>
            </div>
<div class="space-y-2 mt-4">
                <div class="flex justify-between text-sm text-slate-400 font-medium">
                    <span>Lunghezza:</span>
                    <span id="length-val" class="text-cyan-400 font-bold">12</span>
                </div>
                <input type="range" id="length-slider" min="12" max="24" value="14" 
                       class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500"
                       oninput="document.getElementById('length-val').innerText = this.value">
            </div>

            <div class="space-y-1">
    <div class="h-1.5 w-full bg-slate-700 rounded-full overflow-hidden">
        <div id="strength-bar" class="h-full bg-red-500 transition-all duration-500" style="width: 0%"></div>
    </div>
    <p id="strength-text" class="text-[10px] text-slate-500 uppercase tracking-tighter">AFFIDABILITÀ: MEDIA</p>
</div>

            <div class="p-3 bg-slate-900/30 rounded-xl border border-slate-700/50">
                <p class="text-[10px] text-slate-500 text-center leading-tight">
                    🔒 <strong>Sicurezza Pro:</strong> Algoritmo crittografico <code>secrets</code> attivo. 
    Generazione locale immediata, nessun dato viene trasmesso.
</p>   
            </div>


            <button onclick="getAI() " class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all py-5 rounded-2xl font-bold text-xl shadow-lg shadow-blue-500/20">
                GENERA ORA
            </button>
        </div>
    </div>

    <script>
async function getAI() {
            // Legge la lunghezza dallo slider
            const len = document.getElementById('length-slider').value;
            
            // Chiama Python passando la lunghezza
            const res = await fetch(`/generate?length=${len}`);
            const data = await res.json();
            
            // Mostra la password
            document.getElementById('password-display').innerText = data.password;

            // Aggiorna la barra della sicurezza
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            
            if (len < 10) {
                bar.style.width = "30%"; bar.className = "h-1.5 bg-red-500 rounded-full transition-all";
                text.innerText = "Affidabilità: Bassa";
            } else if (len < 16) {
                bar.style.width = "65%"; bar.className = "h-1.5 bg-yellow-500 rounded-full transition-all";
                text.innerText = "Affidabilità: Buona";
            } else {
                bar.style.width = "100%"; bar.className = "h-1.5 bg-green-500 rounded-full transition-all";
                text.innerText = "Affidabilità: Eccellente";
            }
        }
function copyToClipboard() {
    const password = document.getElementById('password-display').innerText;
    if (password === "********" || password === "") return;

    navigator.clipboard.writeText(password).then(() => {
        const toast = document.getElementById('copy-toast');
        
        // Reset e animazione
        toast.classList.remove('opacity-0');
        toast.classList.add('opacity-100');
        toast.style.transform = "translateY(-10px)"; // Lo fa saltare verso l'alto
        
        setTimeout(() => {
            toast.classList.remove('opacity-100');
            toast.classList.add('opacity-0');
            toast.style.transform = "translateY(0px)";
        }, 1500);
    });
}
    </script>
</body>
</html>
